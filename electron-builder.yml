electronLanguages:
  - en
directories:
  output: dist
  buildResources: build
toolsets:
  appimage: 1.0.3
productName: Electorrent
appId: com.github.micro23.electorrent
publish:
  - provider: github
    owner: micro23
    repo: Electorrent
    releaseType: draft
files:
  - '!**/*.map'
mac:
  category: public.app-category.utilities
  extendInfo:
    NSLocalNetworkUsageDescription: Electorrent connects to torrent clients running on devices on your local network.
  target:
    - target: dmg
      arch:
        - universal
        - arm64
    - target: zip
      arch:
        - universal
        - arm64
win:
  target: nsis
linux:
  icon: build/png
  category: Network;FileTransfer;P2P;
  desktop:
    entry:
      MimeType: application/x-bittorrent;x-scheme-handler/magnet;
      Keywords: p2p;bittorrent;
  target:
    - snap
    - AppImage
    - deb
    - rpm
extraFiles:
  - filter:
      - resources
fileAssociations:
  - ext: torrent
    name: Bittorrent Document
    role: Viewer
    description: Torrent Files
afterPack: ./util/after-pack.js
electronVersion: 42.0.1
