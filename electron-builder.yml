electronLanguages:
  - en
directories:
  output: dist
  buildResources: build
toolsets:
  appimage: 1.0.3
productName: Electorrent
appId: com.github.micro23.electorrent
publish:
  - provider: github
    owner: micro23
    repo: Electorrent
    releaseType: draft
files:
  - '!**/*.map'
mac:
  artifactName: "${productName}-${version}-macOS-${arch}.${ext}"
  category: public.app-category.utilities
  extendInfo:
    NSLocalNetworkUsageDescription: Electorrent connects to torrent clients running on devices on your local network.
    CFBundleDocumentTypes:
      - CFBundleTypeName: BitTorrent document
        CFBundleTypeRole: Viewer
        LSHandlerRank: Owner
        LSItemContentTypes:
          - org.bittorrent.torrent
    UTImportedTypeDeclarations:
      - UTTypeIdentifier: org.bittorrent.torrent
        UTTypeDescription: BitTorrent document
        UTTypeConformsTo:
          - public.data
        UTTypeTagSpecification:
          public.filename-extension: torrent
          public.mime-type: application/x-bittorrent
  target:
    - target: dmg
      arch:
        - universal
        - arm64
    - target: zip
      arch:
        - universal
        - arm64
win:
  target: nsis
linux:
  icon: build/png
  category: Network;FileTransfer;P2P;
  desktop:
    entry:
      MimeType: application/x-bittorrent;x-scheme-handler/magnet;
      Keywords: p2p;bittorrent;
  target:
    - snap
    - AppImage
    - deb
    - rpm
extraFiles:
  - filter:
      - resources
fileAssociations:
  - ext: torrent
    name: Bittorrent Document
    role: Viewer
    rank: Owner
    mimeType: application/x-bittorrent
    description: Torrent Files
afterPack: ./util/after-pack.js
electronVersion: 42.0.1
