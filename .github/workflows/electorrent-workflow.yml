name: Electorrent Release

on:
  push:
    branches:
      - master
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # every Sunday at midnight

permissions:
  contents: read

env:
  NODE_VERSION: 22.x
  ELECTRON_IS_DEV: 0

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        client:
          - aria2
          - mock
          - qbittorrent:4
          - qbittorrent:5
          - qbittorrent:latest
          - rtorrent
          - rtorrent:latest
          - transmission
          - deluge:1
          - deluge:2
          - utorrent

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Install dependencies
      run: >
        sudo apt-get update && sudo apt-get install -y
        xvfb
        libnss3-dev
        libdbus-1-dev
        libatk1.0-dev
        libatk-bridge2.0-dev
        libcups2-dev
        libgtk-3-0
        libgbm1
        libasound2t64
    - name: Install nodejs
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: Cache npm modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          */*/node_modules
        key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install npm dependencies
      run: npm install
    - name: Lint
      run: npm run lint
    - name: Test GitHub updater
      run: node --test test/unit/*.test.cjs
    - name: Build web application
      run: npm run build
    - name: Package application
      run: npm run pack
    - name: Run tests
      run: xvfb-run -a -- npm test -- --dist --client "${{ matrix.client }}" --headless --parallel --specFileRetries 0

    - name: Upload test diagnostics
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-diagnostics-${{ strategy.job-index }}
        path: |
          /tmp/electorrent-test-*/logfile.log
          ~/.config/Electorrent/logfile.log
        if-no-files-found: ignore

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Install apt packages
      run: sudo apt-get update && sudo apt-get install -y graphicsmagick icnsutils
      if: runner.os == 'Linux'
    - name: Checkout source code
      uses: actions/checkout@v4
    - name: Install nodejs
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'
    - name: Cache npm modules
      uses: actions/cache@v4
      with:
        path: |
          node_modules
          */*/node_modules
        key: ${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
    - name: Install npm dependencies
      run: npm install
    - name: Verify release version
      if: startsWith(github.ref, 'refs/tags/v')
      shell: bash
      run: |
        node --input-type=module -e 'import fs from "node:fs"; const root = JSON.parse(fs.readFileSync("package.json")); const app = JSON.parse(fs.readFileSync("app/package.json")); if (process.env.GITHUB_REF_NAME !== `v${root.version}` || app.version !== root.version) throw new Error("Release tag must match both package versions")'
    - name: Build distribution
      if: runner.os != 'macOS'
      run: npm run dist
    - name: Build unsigned macOS distribution
      if: runner.os == 'macOS'
      run: npm run dist -- --config.mac.identity=null --config.extraMetadata.manualMacUpdates=true
      env:
        CSC_IDENTITY_AUTO_DISCOVERY: false
    - name: Upload distribution
      uses: actions/upload-artifact@v4
      with:
        name: electorrent-dist-${{ runner.os }}
        path: |
          dist/*.exe
          dist/*.dmg
          dist/*.zip
          dist/*.AppImage
          dist/*.deb
          dist/*.rpm
          dist/*.snap
          dist/*.blockmap
          dist/latest*.yml
        if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Download distributions
      uses: actions/download-artifact@v4
      with:
        pattern: electorrent-dist-*
        path: release-assets
        merge-multiple: true
    - name: Create draft release with installers and update metadata
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        GH_REPO: micro23/Electorrent
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        if gh release view "$RELEASE_TAG" --json isDraft > release.json 2>/dev/null; then
          node -e 'if (!require("./release.json").isDraft) throw new Error("Refusing to overwrite a published release")'
        else
          gh release create "$RELEASE_TAG" --verify-tag --draft --title "$RELEASE_TAG" --generate-notes
        fi
        python3 - <<'PYTHON'
        from pathlib import Path
        for asset in Path("release-assets").iterdir():
            if " " in asset.name:
                asset.rename(asset.with_name(asset.name.replace(" ", "-")))
        PYTHON
        gh release upload "$RELEASE_TAG" release-assets/* --clobber
